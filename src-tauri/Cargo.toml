[package]
name = "money_clock"
version = "0.1.0"
description = "money_clock desktop application foundation"
authors = ["money_clock"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "money_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
